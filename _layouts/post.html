---
layout: default
---
<article class="post">
  <header class="page-hero post-hero">
    <div class="wrap">
      <p class="eyebrow"><a href="{{ "/journal/" | relative_url }}">Journal</a>{% if page.category %} · {{ page.category }}{% endif %}</p>
      <h1>{{ page.title }}</h1>
      <p class="post-date">{{ page.date | date: "%-d %B %Y" }}</p>
    </div>
  </header>
  <div class="band">
    <div class="wrap post-wrap">
      {% if page.image %}<img class="post-cover" src="{{ page.image | relative_url }}" alt="">{% endif %}
      <div class="post-body">
{{ content }}
      </div>
      <p class="post-back"><a href="{{ "/journal/" | relative_url }}">← All journal posts</a></p>
    </div>
  </div>
</article>
